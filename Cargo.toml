[package]
name = "ordinal-networks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fast ordinal pattern symbolisation and ordinal partition networks (Rust core)"
readme = "README.md"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.30"
numpy = "0.30"
rayon = "1.10"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
