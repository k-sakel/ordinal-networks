site_name: ordinal-networks
site_description: Fast ordinal symbolisation and ordinal partition networks for very long time series
site_url: https://k-sakel.github.io/ordinal-networks
repo_url: https://github.com/k-sakel/ordinal-networks
repo_name: k-sakel/ordinal-networks
copyright: Copyright &copy; 2026 Konstantinos Sakellariou. MIT licence.

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/brightness-4, name: Switch to light mode }

nav:
  - Home: index.md
  - Guide:
      - Concepts and conventions: concepts.md
      - Large data: large-data.md
      - Ordinal statistics and entropies: statistics.md
      - Ordinal partition networks: networks.md
      - Dynamical systems: systems.md
  - Coming from:
      - ordpy: from-ordpy.md
      - the MATLAB toolbox: from-matlab.md
  - API reference:
      - Symbolisation: api/symbolize.md
      - Patterns: api/patterns.md
      - Entropy: api/entropy.md
      - Network: api/network.md
      - Storage: api/io.md
      - Mapping, recurrence, metrics, surrogates: api/tools.md
      - Systems: api/systems.md
  - Changelog: changelog.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            docstring_style: numpy
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.snippets: { base_path: ["."], check_paths: true }

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
