name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check python tests benchmarks examples paper
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --lib -- -D clippy::correctness -D clippy::suspicious

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: cargo test --release --lib
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          pip install -e ".[test,graph]"
      - name: Python tests
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        with:
          name: coverage
          path: coverage.xml

  wheels:
    name: wheels (${{ matrix.os }}, ${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: windows-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # abi3 (see pyproject.toml): a single wheel per platform serves every CPython >= 3.10
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  wheel-smoke-test:
    name: install wheel without Rust (${{ matrix.os }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, artifact: wheels-ubuntu-latest-x86_64 }
          - { os: windows-latest, artifact: wheels-windows-latest-x86_64 }
          - { os: macos-latest, artifact: wheels-macos-latest-aarch64 }
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      # install the file itself: with --find-links pip could still pick a published wheel from PyPI
      - name: Install the wheel built in this run
        shell: bash
        run: pip install dist/*.whl
      - name: Quick start returns ln 2
        run: >
          python -c "import ordinal_networks as on, math;
          x = on.systems.generate('logistic', n=10**6);
          h = on.OrdinalSymbolizer(m=10).fit(x).network().spectral_radius(log=True);
          print(h); assert abs(h - math.log(2)) < 0.01"

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: GitHub release
    # on a pushed version tag, or a push to main whose commit message contains "[release]"
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [wheel-smoke-test, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version from pyproject.toml
        id: v
        run: echo "tag=v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ordinal-networks ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  pypi:
    name: Publish to PyPI
    # version tags only. Uses PyPI trusted publishing (OIDC): no token is stored in the repository.
    # One-time setup on pypi.org: add this repository, workflow "ci.yml" and environment "pypi"
    # as a trusted publisher of the project "ordinal-networks".
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheel-smoke-test, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ordinal-networks
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
